<!DOCTYPE html>
<html>

<head>

    <title>Student Portal</title>

    <style>

        body{
            font-family: Arial;
            text-align: center;
            background-color: lightblue;
        }

        .box{
            background-color: white;
            width: 450px;
            margin: auto;
            margin-top: 40px;
            padding: 20px;
            border-radius: 15px;
        }

        input{
            padding: 8px;
            margin: 8px;
            width: 220px;
        }

        button{
            padding: 10px;
            background-color: royalblue;
            color: white;
            border: none;
            border-radius: 10px;
        }

    </style>

</head>

<body>
    <script src="classes_in_js.js">
    </script>

<div class="box">

    <h1>🎓 Student Portal</h1>

    <input type="text" id="name" placeholder="Enter Name">

    <br>

    <input type="number" id="age" placeholder="Age">

    <br>

    <input type="text" id="grade" placeholder="Enter Grade">

    <br>

    <input type="text" id="favsub" placeholder="Favourite Subject">

    <br>

    <input type="text" id="hobby" placeholder="Enter Hobby">

    <br><br>

    <button onclick="showDetails()">

        Show Details

    </button>

    <p id="details"></p>

    <p id="message"></p>

</div>



</body>

</html>
